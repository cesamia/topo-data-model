<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Schema Harmonization{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="{{ static_prefix }}static/style.css"/>
</head>
<body class="d-flex flex-column vh-100 overflow-hidden bg-light">

<!-- Header -->
<header class="sh-header d-flex align-items-center px-3 flex-shrink-0">
  <a href="{{ static_prefix }}index.html" class="text-white text-decoration-none fw-semibold me-2">
    Schema Harmonization
  </a>
  <span class="text-secondary me-2">|</span>
  <span class="sh-sub">1:10k and 1:50k Topographic Datasets</span>
  <span class="badge bg-secondary ms-auto fw-normal">Documentation</span>
</header>

<!-- Body layout -->
<div class="d-flex flex-grow-1 overflow-hidden">

  <!-- Sidebar -->
  <aside class="sh-sidebar d-flex flex-column border-end bg-white flex-shrink-0">
    <div class="p-2 border-bottom bg-white">
      <div class="text-uppercase fw-bold text-secondary mb-2" style="font-size:10px;letter-spacing:.8px">Feature Classes</div>
      <!-- Scale toggle -->
      <div class="btn-group w-100 mb-2" role="group">
        <button class="btn btn-sm btn-outline-secondary active" data-scale="hdm" onclick="setScale('hdm',this)">HDM</button>
        <button class="btn btn-sm btn-outline-secondary" data-scale="10k"  onclick="setScale('10k',this)">10k</button>
        <button class="btn btn-sm btn-outline-secondary" data-scale="50k"  onclick="setScale('50k',this)">50k</button>
      </div>
      <!-- Search -->
      <input id="searchInput" type="text" class="form-control form-control-sm"
             placeholder="Search…" oninput="applyFilter()"/>
      <div id="fcCount" class="text-muted mt-1" style="font-size:11px"></div>
    </div>
    <!-- Legend — clickable badge filters -->
    <div class="d-flex align-items-center gap-1 px-2 py-1 border-bottom bg-light flex-wrap">
      <span class="leg-hdm badge-sh badge-Retained sb-badge-btn" data-badge="Retained" onclick="toggleBadge('Retained',this)" title="Retained">RET</span>
      <span class="leg-hdm badge-sh badge-Modified sb-badge-btn" data-badge="Modified" onclick="toggleBadge('Modified',this)" title="Modified">MOD</span>
      <span class="leg-hdm badge-sh badge-Added    sb-badge-btn" data-badge="Added"    onclick="toggleBadge('Added',this)"    title="Added">ADD</span>
      <span class="leg-src badge-sh badge-Mapped   sb-badge-btn d-none" data-badge="Mapped"  onclick="toggleBadge('Mapped',this)"  title="Mapped to HDM">MAP</span>
      <span class="leg-src badge-sh badge-Deleted  sb-badge-btn d-none" data-badge="Deleted" onclick="toggleBadge('Deleted',this)" title="Deleted from HDM">DEL</span>
      <span id="badgeReset" class="d-none ms-auto sb-reset" onclick="resetBadge()" title="Clear filter">✕</span>
    </div>
    <!-- FC list — populated by nav-data.js -->
    <nav id="fcNav" class="fc-list overflow-y-auto flex-grow-1" style="visibility:hidden"></nav>
  </aside>

  <!-- Main -->
  <main class="flex-grow-1 overflow-y-auto p-3">
    {% block content %}{% endblock %}
  </main>
</div>

<script>
  const FC_PREFIX   = "{{ static_prefix }}fc/";
  const ACTIVE_FC   = "{{ active or '' }}";
  const BADGE_LABELS = {Modified:"MOD",Retained:"RET",Added:"ADD",Deleted:"DEL",Mapped:"MAP"};
</script>
<script src="{{ static_prefix }}static/nav-data.js"></script>
<script>
  function buildNav() {
    const nav = document.getElementById('fcNav');
    const frag = document.createDocumentFragment();
    NAV_DATA.forEach(item => {
      const a = document.createElement('a');
      a.href = FC_PREFIX + item.canonical + '.html';
      a.className = 'fc-item px-2 py-1 text-decoration-none text-dark' +
                    (item.canonical === ACTIVE_FC ? ' fc-item-active' : '');
      a.dataset.name  = item.name;
      a.dataset.list  = item.list;
      a.dataset.badge = item.badge;
      a.innerHTML = `<span class="badge-sh badge-${item.badge} flex-shrink-0">${BADGE_LABELS[item.badge] || item.badge}</span>` +
                    `<span class="text-truncate" style="font-size:12.5px">${item.display}</span>`;
      frag.appendChild(a);
    });
    nav.appendChild(frag);
  }

  let activeScale = sessionStorage.getItem('sb_scale') || 'hdm';
  let activeBadge = sessionStorage.getItem('sb_badge') || null;

  function setScale(scale, btn) {
    activeScale = scale;
    activeBadge = null;
    sessionStorage.setItem('sb_scale', scale);
    sessionStorage.removeItem('sb_badge');
    document.querySelectorAll('[data-scale]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const isHdm = scale === 'hdm';
    document.querySelectorAll('.leg-hdm').forEach(el => el.classList.toggle('d-none', !isHdm));
    document.querySelectorAll('.leg-src').forEach(el => el.classList.toggle('d-none', isHdm));
    document.querySelectorAll('.sb-badge-btn').forEach(b => b.classList.remove('sb-badge-active'));
    document.getElementById('badgeReset').classList.add('d-none');
    applyFilter();
  }

  function toggleBadge(badge, el) {
    if (activeBadge === badge) {
      activeBadge = null;
      sessionStorage.removeItem('sb_badge');
      el.classList.remove('sb-badge-active');
      document.getElementById('badgeReset').classList.add('d-none');
    } else {
      activeBadge = badge;
      sessionStorage.setItem('sb_badge', badge);
      document.querySelectorAll('.sb-badge-btn').forEach(b => b.classList.remove('sb-badge-active'));
      el.classList.add('sb-badge-active');
      document.getElementById('badgeReset').classList.remove('d-none');
    }
    applyFilter();
  }

  function resetBadge() {
    activeBadge = null;
    sessionStorage.removeItem('sb_badge');
    document.querySelectorAll('.sb-badge-btn').forEach(b => b.classList.remove('sb-badge-active'));
    document.getElementById('badgeReset').classList.add('d-none');
    applyFilter();
  }

  function applyFilter() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    let vis = 0;
    document.querySelectorAll('.fc-item').forEach(el => {
      const show = el.dataset.list === activeScale
                && (!activeBadge  || el.dataset.badge === activeBadge)
                && (!q            || el.dataset.name.includes(q));
      el.style.display = show ? 'flex' : 'none';
      if (show) vis++;
    });
    document.getElementById('fcCount').textContent = vis + ' feature classes';
    document.getElementById('fcNav').style.visibility = 'visible';
  }

  // Restore state on every page load
  (function () {
    buildNav();
    const isHdm = activeScale === 'hdm';
    document.querySelectorAll('[data-scale]').forEach(b =>
      b.classList.toggle('active', b.dataset.scale === activeScale));
    document.querySelectorAll('.leg-hdm').forEach(el => el.classList.toggle('d-none', !isHdm));
    document.querySelectorAll('.leg-src').forEach(el => el.classList.toggle('d-none',  isHdm));
    if (activeBadge) {
      document.querySelectorAll('.sb-badge-btn').forEach(b =>
        b.classList.toggle('sb-badge-active', b.dataset.badge === activeBadge));
      document.getElementById('badgeReset').classList.remove('d-none');
    }
    applyFilter();
    const cur = document.querySelector('.fc-item-active[style*="flex"]');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  })();
</script>
</body>
</html>
